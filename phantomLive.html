<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Live — Chess.com Viewer</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
          integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ── Layout ── */
        .live-page {
            padding: calc(var(--nav-height, 70px) + 24px) 24px 40px;
            min-height: 100vh;
        }

        .live-header {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto 28px;
        }

        .live-header__title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full, 9999px);
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .live-badge.idle    { background: rgba(85,85,106,0.3); color: var(--text-secondary, #8888a0); border: 1px solid #2a2a3a; }
        .live-badge.polling { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
        .live-badge.live    { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .live-badge.ended   { background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

        .live-badge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: currentColor;
        }
        .live-badge.live .dot { animation: blink 1.2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

        /* ── Main grid ── */
        .live-content {
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Cards ── */
        .live-card {
            background: var(--bg-card, #12121a);
            border: 1px solid var(--border-subtle, #2a2a3a);
            border-radius: var(--radius-lg, 20px);
            padding: 20px;
        }

        .live-card__title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-purple, #8b5cf6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle, #2a2a3a);
        }

        /* ── Input panel ── */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-secondary, #8888a0);
            font-weight: 500;
        }

        .live-input {
            background: var(--bg-input, #0d0d14);
            border: 1px solid var(--border-subtle, #2a2a3a);
            border-radius: var(--radius-sm, 6px);
            color: var(--text-primary, #f0f0f5);
            padding: 10px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            width: 100%;
            transition: border-color 0.15s;
        }
        .live-input:focus { outline: none; border-color: var(--accent-purple, #8b5cf6); }
        .live-input::placeholder { color: var(--text-muted, #55556a); }

        .btn-primary {
            width: 100%;
            padding: 11px;
            border-radius: var(--radius-sm, 6px);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-connect {
            background: linear-gradient(135deg, #00d4ff22, #8b5cf622);
            border: 1px solid var(--phantom-blue, #00d4ff);
            color: var(--phantom-blue, #00d4ff);
        }
        .btn-connect:hover { background: linear-gradient(135deg, #00d4ff33, #8b5cf633); }
        .btn-connect:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-stop {
            background: rgba(239,68,68,0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            margin-top: 8px;
        }
        .btn-stop:hover { background: rgba(239,68,68,0.2); }
        .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Game info ── */
        .player-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm, 6px);
            margin-bottom: 8px;
        }
        .player-row.white { background: rgba(255,255,255,0.04); }
        .player-row.black { background: rgba(0,0,0,0.3); }

        .player-color-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .player-row.white .player-color-dot { background: #f0f0f5; border: 1px solid #555; }
        .player-row.black .player-color-dot { background: #1a1a2e; border: 1px solid #888; }

        .player-name {
            font-weight: 600;
            font-size: 0.9rem;
            flex: 1;
        }
        .player-rating {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary, #8888a0);
        }
        .player-active { color: #10b981; }

        .game-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .meta-tag {
            padding: 3px 10px;
            border-radius: var(--radius-full, 9999px);
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(99,102,241,0.15);
            color: #8b5cf6;
            border: 1px solid rgba(99,102,241,0.3);
        }

        /* ── Board ── */
        .board-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #liveBoard {
            width: 100%;
            max-width: 520px;
        }

        /* ── Moves ── */
        .moves-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 420px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-subtle, #2a2a3a) transparent;
        }

        .move-row {
            display: grid;
            grid-template-columns: 28px 1fr 1fr;
            gap: 4px;
            align-items: center;
            padding: 4px 6px;
            border-radius: 4px;
        }
        .move-row:hover { background: rgba(255,255,255,0.03); }
        .move-row.current { background: rgba(99,102,241,0.15); }

        .move-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-muted, #55556a);
        }
        .move-san {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-primary, #f0f0f5);
            font-weight: 500;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
            transition: background 0.1s;
        }
        .move-san:hover { background: rgba(255,255,255,0.06); }
        .move-san.active { background: rgba(99,102,241,0.3); color: #a5b4fc; }

        /* ── Phantom panel ── */
        .phantom-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-sm, 6px);
            font-size: 0.8rem;
            margin-bottom: 12px;
        }
        .phantom-status.disconnected { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .phantom-status.connected    { background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }

        .phantom-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-secondary, #8888a0);
            margin-bottom: 10px;
        }

        /* Toggle switch */
        .toggle-switch {
            position: relative;
            width: 40px; height: 22px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; inset: 0;
            background: #2a2a3a;
            border-radius: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 16px; height: 16px;
            left: 3px; top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #10b981; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

        /* ── Log ── */
        .live-log {
            background: var(--bg-input, #0d0d14);
            border: 1px solid var(--border-subtle, #2a2a3a);
            border-radius: var(--radius-sm, 6px);
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-secondary, #8888a0);
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .log-line.info  { color: #8888a0; }
        .log-line.ok    { color: #10b981; }
        .log-line.warn  { color: #f59e0b; }
        .log-line.error { color: #ef4444; }

        /* ── Speed ── */
        .speed-control {
            margin-top: 12px;
        }
        .speed-control label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary, #8888a0);
            margin-bottom: 6px;
        }
        input[type=range] {
            width: 100%;
            accent-color: var(--phantom-blue, #00d4ff);
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .live-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Nav placeholder (reprend la nav du projet si incluse) -->
<div class="live-page">

    <!-- Header -->
    <div class="live-header">
        <h1 class="live-header__title">Phantom Live</h1>
        <span class="live-badge idle" id="statusBadge">
            <span class="dot"></span>
            <span id="statusText">En attente</span>
        </span>
    </div>

    <div class="live-content">

        <!-- ══ COL 1 : Contrôles ══ -->
        <div style="display:flex; flex-direction:column; gap:16px;">

            <!-- Connexion partie -->
            <div class="live-card">
                <div class="live-card__title"><i class="fas fa-chess"></i> Partie Chess.com</div>

                <div class="input-group">
                    <label>ID ou URL de la partie</label>
                    <input type="text" class="live-input" id="gameInput"
                           placeholder="ex: 123456789">
                    <small style="color:var(--text-muted,#55556a); font-size:0.72rem;">
                        URL chess.com/game/live/123456789 ou ID seul
                    </small>
                </div>

                <div class="input-group">
                    <label>Intervalle de polling (s)</label>
                    <input type="number" class="live-input" id="pollInterval"
                           value="3" min="1" max="15" style="width:80px;">
                </div>

                <button class="btn-primary btn-connect" id="btnConnect">
                    <i class="fas fa-plug"></i> Connecter
                </button>
                <button class="btn-primary btn-stop" id="btnStop" disabled>
                    <i class="fas fa-stop"></i> Arrêter
                </button>
            </div>

            <!-- Infos partie -->
            <div class="live-card" id="gameInfoCard">
                <div class="live-card__title"><i class="fas fa-info-circle"></i> Infos partie</div>

                <div class="player-row white">
                    <div class="player-color-dot"></div>
                    <span class="player-name" id="playerWhite">—</span>
                    <span class="player-rating" id="ratingWhite"></span>
                </div>
                <div class="player-row black">
                    <div class="player-color-dot"></div>
                    <span class="player-name" id="playerBlack">—</span>
                    <span class="player-rating" id="ratingBlack"></span>
                </div>

                <div class="game-meta" id="gameMeta"></div>
            </div>

        </div>

        <!-- ══ COL 2 : Échiquier ══ -->
        <div class="board-wrapper">
            <div id="liveBoard"></div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text-muted,#55556a);" id="fenDisplay">
                FEN : —
            </div>
        </div>

        <!-- ══ COL 3 : Coups + Phantom ══ -->
        <div style="display:flex; flex-direction:column; gap:16px;">

            <!-- Moves -->
            <div class="live-card" style="flex:1;">
                <div class="live-card__title"><i class="fas fa-list"></i> Coups joués</div>
                <div class="moves-list" id="movesList">
                    <span style="color:var(--text-muted,#55556a); font-size:0.8rem;">Aucun coup pour l'instant</span>
                </div>
            </div>

            <!-- Phantom -->
            <div class="live-card">
                <div class="live-card__title"><i class="fas fa-robot"></i> Phantom</div>

                <div class="phantom-status disconnected" id="phantomStatus">
                    <i class="fas fa-times-circle"></i> Déconnecté
                </div>

                <button class="btn-primary btn-connect" id="btnPhantom" style="margin-bottom:8px;">
                    <i class="fas fa-robot"></i> Connecter Phantom
                </button>

                <div class="phantom-toggle">
                    <span>Sync automatique</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="phantomAutoSync" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="speed-control">
                    <label>
                        <span>Vitesse Phantom</span>
                        <span id="speedVal">50%</span>
                    </label>
                    <input type="range" id="phantomSpeed" min="1" max="100" value="50">
                </div>
            </div>

            <!-- Log -->
            <div class="live-card">
                <div class="live-card__title"><i class="fas fa-terminal"></i> Log</div>
                <div class="live-log" id="liveLog"></div>
            </div>

        </div>
    </div>
</div>

<!-- Libs -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="js/phantom.js"></script>

<script>
// ── Décodeur TCN (Two Character Notation chess.com) ──
const TCN_CHARS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?';
const FILES = 'abcdefgh';

function decodeTCNMove(two) {
    const c1 = TCN_CHARS.indexOf(two[0]);
    const c2 = TCN_CHARS.indexOf(two[1]);
    if (c1 === -1 || c2 === -1) return null;

    const fromFile = FILES[c1 % 8];
    const fromRank = Math.floor(c1 / 8) + 1;
    const toFile   = FILES[c2 % 8];
    const toRank   = Math.floor(c2 / 8) + 1;

    if (fromRank < 1 || fromRank > 8 || toRank < 1 || toRank > 8) return null;
    return `${fromFile}${fromRank}${toFile}${toRank}`;
}

// ── État ──
const state = {
    polling: false,
    pollTimer: null,
    legacyId: null,
    uuid: null,
    lastMoveCount: 0,
    chess: null,
    board: null,
    moveHistory: [],
};

// ── Helpers UI ──
function log(msg, type = 'info') {
    const el = document.getElementById('liveLog');
    const line = document.createElement('div');
    line.className = `log-line ${type}`;
    const ts = new Date().toLocaleTimeString('fr-FR');
    line.textContent = `[${ts}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
}

function setStatus(s, text) {
    const badge = document.getElementById('statusBadge');
    badge.className = `live-badge ${s}`;
    document.getElementById('statusText').textContent = text;
}

function parseGameId(input) {
    input = input.trim();
    const match = input.match(/\/(\d+)\/?$/);
    if (match) return match[1];
    if (/^\d+$/.test(input)) return input;
    return null;
}

// ── Init échiquier ──
function initBoard() {
    state.chess = new Chess();
    state.board = Chessboard('liveBoard', {
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        draggable: false,
    });
    window.addEventListener('resize', () => state.board.resize());
}

// ── Étape 1 : récupérer UUID + infos joueurs ──
async function fetchGameInfo(legacyId) {
    const r = await fetch(`/proxy/chess/${legacyId}`);
    if (!r.ok) throw new Error(`Infos partie : HTTP ${r.status}`);
    return await r.json();
}

// ── Étape 2 : récupérer les coups ──
async function fetchMoves(uuid) {
    const r = await fetch(`/proxy/chess-moves/?url=${encodeURIComponent(state.movesUrl)}`);
    if (!r.ok) throw new Error(`Coups : HTTP ${r.status}`);
    return await r.json();
}

// ── Appliquer les coups TCN ──
function applyMoves(movesArray) {
    if (movesArray.length === state.lastMoveCount) return false;

    state.chess.reset();
    state.moveHistory = [];

    for (const [tcn] of movesArray) {
        const uci = decodeTCNMove(tcn);
        if (!uci) continue;
        const move = state.chess.move({
            from: uci.slice(0, 2),
            to:   uci.slice(2, 4),
            promotion: uci[4] || undefined
        });
        if (move) state.moveHistory.push(move.san);
    }

    state.lastMoveCount = movesArray.length;
    return true;
}

// ── Mettre à jour l'UI ──
function updateUI(gameInfo) {
    const fen = state.chess.fen();
    state.board.position(fen, false);
    document.getElementById('fenDisplay').textContent = `FEN : ${fen}`;

    if (document.getElementById('phantomAutoSync').checked &&
        window.phantomChessboard?.isConnected) {
        window.phantomChessboard.syncPosition(fen);
    }

    renderMoveList();

    if (gameInfo?.playersDetails?.length >= 2) {
        const w = gameInfo.playersDetails[0];
        const b = gameInfo.playersDetails[1];
        document.getElementById('playerWhite').textContent = w.username || '—';
        document.getElementById('ratingWhite').textContent = w.rating ? `(${w.rating})` : '';
        document.getElementById('playerBlack').textContent = b.username || '—';
        document.getElementById('ratingBlack').textContent = b.rating ? `(${b.rating})` : '';

        const meta = document.getElementById('gameMeta');
        if (meta.children.length === 0) {
            if (gameInfo.timeclass) addTag(meta, gameInfo.timeclass);
            if (gameInfo.rated)     addTag(meta, 'Rated');
        }
    }
}

function addTag(container, text) {
    const t = document.createElement('span');
    t.className = 'meta-tag';
    t.textContent = text;
    container.appendChild(t);
}

function renderMoveList() {
    const el = document.getElementById('movesList');
    el.innerHTML = '';
    if (state.moveHistory.length === 0) {
        el.innerHTML = '<span style="color:var(--text-muted,#55556a);font-size:0.8rem;">Aucun coup pour l\'instant</span>';
        return;
    }
    for (let i = 0; i < state.moveHistory.length; i += 2) {
        const row = document.createElement('div');
        const isLast = i >= state.moveHistory.length - 2;
        row.className = `move-row${isLast ? ' current' : ''}`;
        row.innerHTML = `
            <span class="move-num">${Math.floor(i/2)+1}.</span>
            <span class="move-san${i === state.moveHistory.length-1 ? ' active' : ''}">${state.moveHistory[i]}</span>
            <span class="move-san${i+1 === state.moveHistory.length-1 ? ' active' : ''}">${state.moveHistory[i+1] || ''}</span>
        `;
        el.appendChild(row);
    }
    el.scrollTop = el.scrollHeight;
}

// ── Boucle de polling ──
async function poll(gameInfo) {
    if (!state.polling) return;

    try {
        const data = await fetchMoves(state.uuid);
        const movesArray = data.moves ?? [];
        const changed = applyMoves(movesArray);

        if (changed) {
            updateUI(gameInfo);
            log(`${state.lastMoveCount} coups — ${state.chess.fen().split(' ')[0]}`, 'ok');
        }

        // Fin de partie
        if (state.chess.game_over() || data.status === 'finished') {
            setStatus('ended', 'Terminée');
            log('Partie terminée', 'warn');
            stopPolling();
            return;
        }

        setStatus('live', 'En direct');
    } catch (err) {
        log(`Erreur : ${err.message}`, 'error');
    }

    const interval = parseInt(document.getElementById('pollInterval').value) * 1000;
    state.pollTimer = setTimeout(() => poll(gameInfo), interval);
}

function stopPolling() {
    state.polling = false;
    clearTimeout(state.pollTimer);
    document.getElementById('btnConnect').disabled = false;
    document.getElementById('btnStop').disabled = true;
}

document.getElementById('btnPhantom').addEventListener('click', async () => {
    if (!window.phantomChessboard) {
        log('Module Phantom non chargé', 'error');
        return;
    }
    const connected = await window.phantomChessboard.connect();
    if (connected) {
        log('Phantom connecté', 'ok');
        // Sync immédiate si une partie est en cours
        if (state.chess && state.lastMoveCount > 0) {
            window.phantomChessboard.sendGameStart();
            window.phantomChessboard.syncPosition(state.chess.fen());
            log('Phantom synchronisé sur la position actuelle', 'ok');
        }
    } else {
        log('Connexion Phantom échouée', 'error');
    }
});

// ── Connexion ──
document.getElementById('btnConnect').addEventListener('click', async () => {
    const raw = document.getElementById('gameInput').value;
    const legacyId = parseGameId(raw);
    if (!legacyId) { log('ID invalide', 'error'); return; }

    setStatus('polling', 'Connexion…');
    log(`Récupération des infos pour la partie ${legacyId}…`, 'info');

    document.getElementById('btnConnect').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('gameMeta').innerHTML = '';

    try {
        const gameInfo = await fetchGameInfo(legacyId);
        state.uuid = gameInfo.id;
        state.movesUrl = gameInfo.transports.http.url;
        state.legacyId = legacyId;
        state.lastMoveCount = 0;
        state.moveHistory = [];
        state.chess.reset();
        state.board.position('start');

        log(`UUID : ${state.uuid}`, 'ok');
        log(`${gameInfo.playersDetails?.[0]?.username} vs ${gameInfo.playersDetails?.[1]?.username}`, 'ok');


        // Ajouter ici
        if (window.phantomChessboard?.isConnected) {
            window.phantomChessboard.sendGameStart();
            log('Phantom : partie démarrée', 'ok');
        }


        state.polling = true;
        log(`UUID utilisé : ${state.uuid}`, 'info');
        await poll(gameInfo);

    } catch (err) {
        log(`Erreur connexion : ${err.message}`, 'error');
        setStatus('idle', 'Erreur');
        document.getElementById('btnConnect').disabled = false;
        document.getElementById('btnStop').disabled = true;
    }
});

document.getElementById('btnStop').addEventListener('click', () => {
    stopPolling();
    setStatus('idle', 'Arrêté');
    log('Arrêté manuellement', 'warn');
});

document.getElementById('phantomSpeed').addEventListener('input', function() {
    document.getElementById('speedVal').textContent = this.value + '%';
    if (window.phantomChessboard?.isConnected) {
        window.phantomChessboard.setSpeed(parseInt(this.value));
    }
});

setInterval(() => {
    const el = document.getElementById('phantomStatus');
    if (window.phantomChessboard?.isConnected) {
        el.className = 'phantom-status connected';
        el.innerHTML = '<i class="fas fa-check-circle"></i> Connecté';
    } else {
        el.className = 'phantom-status disconnected';
        el.innerHTML = '<i class="fas fa-times-circle"></i> Déconnecté';
    }
}, 2000);

document.addEventListener('DOMContentLoaded', () => {
    initBoard();
    log('Phantom Live prêt', 'ok');
    log('Entrez un ID de partie chess.com en cours', 'info');
});
</script>

</body>
</html>
