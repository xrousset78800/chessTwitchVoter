services:
  app:
    build: .
    container_name: chesstwitchvoter
    restart: unless-stopped
    environment:
      - PORT=3000
      # Régie du 24/24 (Phantom, pause, vue réelle, étapes forcées) : logins Twitch séparés par des virgules
      - H24_REGIE=xou____
      # Clé de l'application Twitch (photos des votants…) : transmise par le déploiement depuis les secrets GitHub
      - TWITCH_CLIENT_ID
      - TWITCH_CLIENT_SECRET
    volumes:
      # Records Puzzle Rush, batailles Multi et stats viewers : conservés entre les déploiements
      - chess-data:/app/data
    networks: [web]

volumes:
  chess-data:

networks:
  web:
    external: true
